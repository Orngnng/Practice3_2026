<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список студентов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        a.btn { display: inline-block; padding: 8px 14px; background: #2d7ff9; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="top">
        <h1>Список студентов</h1>
        <div>
            <span th:text="'Вы вошли как: ' + ${username}"></span>
            <a th:href="@{/logout}">Выйти</a>
        </div>
    </div>
    <a class="btn" th:href="@{/students/add}">Добавить студента</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Курс</th>
                <th>Задолженность</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.course}"></td>
                <td th:text="${s.hasDebt} ? 'Есть' : 'Нет'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="4">Студентов пока нет</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
